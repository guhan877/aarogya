<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>AROGYA - Smart Hospital Care</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f8f6;--cd:#fff;--tx:#0e2b26;--mu:#5a7a73;--pr:#0d7f6e;--pd:#095a4d;--ac:#dff2ec;--bd:#d2e6e0;--rd:#d92d3a;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1816;--cd:#122522;--tx:#e4f3ef;--mu:#8db0a8;--pr:#2bb8a0;--pd:#7fe0cc;--ac:#173430;--bd:#22403b;--on:#05201a}}
:root[data-theme=dark]{--bg:#0b1816;--cd:#122522;--tx:#e4f3ef;--mu:#8db0a8;--pr:#2bb8a0;--pd:#7fe0cc;--ac:#173430;--bd:#22403b;--on:#05201a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:15px/1.55 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:.5em 0 .3em;line-height:1.2}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--cd);border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.logo{font:700 26px Fraunces,serif;color:var(--pr);letter-spacing:3px}
nav{display:flex;gap:4px;overflow-x:auto;flex:1}nav a{padding:7px 13px;border-radius:99px;cursor:pointer;white-space:nowrap;color:var(--mu);font-weight:500}
nav a.on{background:var(--ac);color:var(--pd)}nav a.emb{color:var(--rd);font-weight:700}
.rt{display:flex;gap:4px}.rt button{background:var(--ac);color:var(--pd)}.rt button.on{background:var(--pr);color:var(--on)}
main{max-width:1080px;margin:auto;padding:20px 16px 110px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;margin:10px 0}
.hero{background:linear-gradient(120deg,#0a5f52,#0d8f7a 60%,#f2a93b 140%);color:#fff;border-radius:20px;padding:38px 26px}
.hero h1{font-size:clamp(28px,5vw,46px);max-width:15em}.hero p{max-width:38em;opacity:.95}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{flex:1;min-width:180px}
input,select,textarea{font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--cd);color:var(--tx);width:100%;margin:4px 0 8px}
input[type=checkbox]{width:auto;margin:0}label{font-weight:500;font-size:13px}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 15px;background:var(--pr);color:var(--on);font-weight:600;text-decoration:none;display:inline-block}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #f2a93b;outline-offset:2px}
.dc{display:flex;gap:12px}.av{font-size:28px;width:52px;height:52px;border-radius:50%;background:var(--ac);display:grid;place-items:center;flex:none}
.mu{color:var(--mu);font-size:13px}.ok{color:#12a05a;font-size:13px;font-weight:600}
.sl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.sl button{background:var(--ac);color:var(--pd);padding:5px 10px;font-size:13px}
.em{background:linear-gradient(120deg,#b3131f,#e0343f);color:#fff;border-radius:18px;padding:22px}.em .btn{background:#fff;color:#a3121e;margin:4px 4px 0 0}
.ap{border-left:4px solid var(--pr);padding:6px 10px;margin:8px 0;background:var(--ac);border-radius:8px}.ap.urg{border-color:var(--rd);background:#d92d3a22}
.pr{padding:9px 6px;border-bottom:1px solid var(--bd);cursor:pointer}.pr:hover{background:var(--ac)}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120px);background:var(--pd);color:#fff;padding:12px 18px;border-radius:12px;transition:.3s;z-index:30;max-width:90vw}#toast.on{transform:translate(-50%,0)}
#al{display:none;position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:40;background:#f2a93b;color:#241800;padding:16px 20px;border-radius:14px;box-shadow:0 8px 30px #0006;text-align:center}#al.on{display:block}
#bot{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
#bb{width:72px;height:72px;border-radius:50%;padding:0;background:none;animation:bob 2.4s ease-in-out infinite;box-shadow:0 6px 18px #0004}
@keyframes bob{50%{transform:translateY(-6px)}}@media(prefers-reduced-motion:reduce){#bb{animation:none}}
#hi{position:absolute;right:76px;bottom:20px;background:var(--cd);border:1px solid var(--bd);padding:7px 12px;border-radius:12px;white-space:nowrap;font-size:13px}
#cb{display:none;position:absolute;right:0;bottom:84px;width:min(340px,calc(100vw - 32px));height:430px;background:var(--cd);border:1px solid var(--bd);border-radius:16px;flex-direction:column;box-shadow:0 10px 40px #0004;overflow:hidden}#cb.on{display:flex}
#cb h4{margin:0;padding:12px 14px;background:var(--pr);color:var(--on)}#ms{flex:1;overflow:auto;padding:10px}
.m{padding:8px 12px;border-radius:12px;max-width:88%;margin:5px 0;font-size:14px}.b{background:var(--ac)}.u{background:var(--pr);color:var(--on);margin-left:auto}
#cb .row{padding:8px;border-top:1px solid var(--bd)}#cb input{margin:0}
</style></head><body>
<header><div class="logo">AROGYA</div><nav id="nav"></nav><div class="rt"><button id="rp" class="on" onclick="setRole('patient')">Patient</button><button id="rd" onclick="setRole('doctor')">Doctor</button></div></header>
<main id="app"></main><div id="toast"></div><div id="al"></div>
<div id="bot"><div id="cb"><h4>Dr. Aru, your health assistant</h4><div id="ms"></div><div class="row"><input id="qi" placeholder="Ask a health question" onkeydown="if(event.key=='Enter')chat()"><button onclick="chat()">Send</button></div></div>
<span id="hi">Hi! Need help?</span>
<button id="bb" onclick="tb()" aria-label="Open health chatbot"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="31" fill="#0d7f6e"/><circle cx="32" cy="35" r="16" fill="#ffd7b5"/><path d="M15 31c0-13 8-17 17-17s17 4 17 17z" fill="#fff"/><path d="M29 20h6M32 17v6" stroke="#d92d3a" stroke-width="3"/><circle cx="26" cy="36" r="2.2" fill="#222"/><circle cx="38" cy="36" r="2.2" fill="#222"/><path d="M26 43q6 5 12 0" stroke="#222" fill="none" stroke-width="2" stroke-linecap="round"/><path d="M19 53q13 9 26 0" stroke="#f2a93b" fill="none" stroke-width="3"/></svg></button></div>
<script>
const S=["General Physician","Cardiologist","Dermatologist","Pediatrician","Orthopedic","Neurologist","ENT Specialist","Gynecologist","Psychiatrist","Ophthalmologist","Dentist","Pulmonologist"],
IC=["🩺","❤️","🧴","🧒","🦴","🧠","👂","🤰","💭","👁️","🦷","🫁"],
K=["fever cold cough headache flu weak fatigue vomit stomach","chest heart palpitation bp pressure","skin rash itch acne allergy hair","child baby kid infant","bone joint knee back fracture shoulder","migraine seizure numb dizzy stroke memory","ear throat nose sinus tonsil hearing","pregnan period women menstru","stress anxiety depress sleep mood","eye vision sight","tooth teeth gum dental","breath asthma lung wheez"],
N="Anita Rao,Vikram Shah,Meera Nair,Suresh Iyer,Priya Menon,Arjun Reddy,Kavya Pillai,Rahul Verma,Sneha Kulkarni,Imran Khan,Divya Sharma,Karthik Raj,Lakshmi Devi,Naveen Kumar,Farah Ali,Ganesh Babu,Pooja Singh,Harish Patel,Nandini Das,Rohit Mehta,Swathi Bhat,Manoj Pandey,Deepa Joshi,Sanjay Gupta".split(","),
H=[["City Care Hospital",1.2,8],["Green Cross Hospital",2.6,5],["Unity Medical Centre",3.4,12],["Sunrise Institute of Medicine",5.1,9],["Lifeline Multispeciality",6.8,15],["Riverside General Hospital",8.3,6]],
DOCS=N.map((n,i)=>({id:i,n:"Dr. "+n,s:i%12,h:(i+(i>11))%6,exp:5+(i*7)%20,fee:300+(i%5)*100,slots:["09:00","10:30","12:00","16:00","18:30"]})),
J=a=>a.join(""),$=s=>document.querySelector(s),app=$("#app"),today=new Date().toISOString().slice(0,10);
let P=[{a:"234156789012",n:"Ravi Kumar",age:42,g:"M",ph:"9876543210",bl:"B+",al:"Penicillin",v:[{d:"2026-08-14",dr:"Dr. Vikram Shah",pr:"Chest pain on exertion",m:[["Aspirin 75mg",[1,0,0],30],["Atorvastatin 10mg",[0,0,1],30],["Metformin 500mg",[1,1,1],30]]},{d:"2026-05-02",dr:"Dr. Anita Rao",pr:"Fever and body ache",m:[["Paracetamol 500mg",[1,1,1],5]]}]},
{a:"345267890123",n:"Sunita Devi",age:35,g:"F",ph:"9123456780",bl:"O+",al:"None",v:[{d:"2026-09-10",dr:"Dr. Priya Menon",pr:"Skin rash",m:[["Cetirizine 10mg",[0,0,1],7]]}]},
{a:"456378901234",n:"Arun Prakash",age:8,g:"M",ph:"9988776655",bl:"A+",al:"Dust",v:[{d:"2026-09-01",dr:"Dr. Suresh Iyer",pr:"Cough and cold",m:[["Amoxicillin syrup 5ml",[1,1,1],5]]}]},
{a:"567489012345",n:"Fatima Begum",age:58,g:"F",ph:"9000011111",bl:"AB+",al:"Sulfa drugs",v:[{d:"2026-08-28",dr:"Dr. Arjun Reddy",pr:"Knee pain (arthritis)",m:[["Diclofenac 50mg",[1,0,1],10],["Calcium 500mg",[0,1,0],60]]}]}],
A=[{p:"Sunita Devi",dr:"Emergency team",h:"Green Cross Hospital",t:"NOW",why:"EMERGENCY: road accident",em:1},{p:"Ravi Kumar",dr:"Dr. Vikram Shah",h:"Unity Medical Centre",t:"Today 16:00",why:"Follow-up",em:0}],
KB=[["fever|temperature","For fever: rest, drink fluids and take paracetamol as directed. See a doctor if it lasts over 3 days, crosses 103°F, or comes with rash, stiff neck or breathing trouble."],["cold|cough|sore throat","Try warm fluids, steam inhalation, honey-ginger tea and rest. See a doctor if cough lasts over a week or with breathlessness."],["headache|migraine","Rest in a dark quiet room and drink water. A sudden severe headache, vomiting or vision change needs urgent care."],["diabet|sugar","Normal fasting sugar is 70-100 mg/dL. Eat balanced meals, walk 30 minutes daily and never skip medicines. Book a General Physician for regular checks."],["bp|blood pressure|hypertension","Normal BP is about 120/80. Cut salt, exercise, manage stress and take BP medicines regularly."],["chest pain|heart attack","Chest pain can be serious. Open the Emergency page or call 108 right now."],["stomach|vomit|diarr|loose","Sip ORS, eat light food (rice, banana, curd). See a doctor for blood in stool, severe pain or fever."],["sleep|insomnia","Keep fixed sleep timings, avoid screens and caffeine at night. Persistent trouble? Book a Psychiatrist."],["stress|anxiety|depress","You are not alone. Try deep breathing and talk to someone you trust. Use Tele-consult to book a counselling video call."],["water|hydrat","Aim for 2-3 litres of water a day, more in hot weather or during fever."],["burn","Cool the burn under running water for 10-15 minutes. No ice, toothpaste or butter. Go to Emergency for large burns."],["cut|bleed|wound","Press firmly with a clean cloth for 10 minutes and wash gently. Deep or non-stopping bleeding needs Emergency care."],["pregnan","Take folic acid and attend regular check-ups. Book a Gynecologist from the Doctors page."],["alarm|remind|medicine","Go to My Health, set your morning, afternoon and night times, then tap Enable alarms."],["appoint|book","Type your problem on Home and tap Find care, or pick a doctor on the Doctors page and choose a slot."],["hi|hello|hey","Hello! I can answer basic health questions. Try: fever, headache, BP, sleep."]];
let role="patient",me=0,pg="home",fs=-1,sel=null,draft=[],dx="",T=["08:00","14:00","21:00"],alarmOn=false,last={},ac;
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),3400)};
const PG={home:"Home",docs:"Doctors",em:"Emergency",tele:"Tele-consult",my:"My Health",dr:"Doctor Portal"};
function nav(){$("#nav").innerHTML=J(Object.keys(PG).filter(k=>k=="my"?role=="patient":k=="dr"?role=="doctor":1).map(k=>`<a tabindex=0 class="${k==pg?"on":""} ${k=="em"?"emb":""}" onclick="go('${k}')">${PG[k]}</a>`))}
function go(p){const o=pg;pg=p;nav();app.innerHTML=V[p]();if(o!=p)scrollTo(0,0)}
function setRole(r){role=r;$("#rp").className=r=="patient"?"on":"";$("#rd").className=r=="doctor"?"on":"";go(r=="doctor"?"dr":"home")}
const dcard=d=>{const h=H[d.h];return `<div class="c dc"><div class="av">${IC[d.s]}</div><div><b>${d.n}</b><div class="mu">${S[d.s]}, ${d.exp} yrs, fee ₹${d.fee}</div><div class="mu">${h[0]}, ${h[1]} km away</div><span class="ok">● Available today</span><div class="sl">${J(d.slots.map(t=>`<button onclick="book(${d.id},'${t}')">${t}</button>`))}</div></div></div>`},
apt=a=>`<div class="ap ${a.em?"urg":""}">${a.em?"🚨 ":""}<b>${a.p}</b> with ${a.dr} at ${a.h}<br><span class="mu">${a.t}: ${a.why}</span>${a.link?` <a href="${a.link}" target="_blank" rel="noopener">Join ${a.pf}</a>`:""}</div>`,
hist=p=>J(p.v.map(v=>`<div class="c" style="margin-bottom:10px"><b>${v.d}</b> with ${v.dr}<br>Problem: ${v.pr}<br>💊 ${v.m.map(m=>`${m[0]} (${m[1].join("-")}, ${m[2]} days)`).join("; ")}</div>`)),
medsFor=k=>P[me].v[0].m.filter(m=>m[1][k]).map(m=>m[0]);
const V={
home:()=>`<div class="hero"><h1>Find the right doctor before the pain gets worse.</h1><p>Describe your problem. AROGYA suggests the specialist, shows nearby hospitals with live availability, and books your slot in one tap.</p><div class="row"><input id="sym" placeholder="e.g. chest pain, skin rash, fever for 2 days" onkeydown="if(event.key=='Enter')find()"><button style="background:#fff;color:#095a4d" onclick="find()">Find care</button></div></div><div id="res"></div><h2>How booking works</h2><div class="g">${J(["Describe your problem","See nearby hospitals and who is available","Pick a slot and confirm","Get your prescription on WhatsApp, with medicine alarms"].map((t,i)=>`<div class="c"><h3>Step ${i+1}</h3>${t}</div>`))}</div><p class="mu">24 doctors, 12 specialties, 6 hospitals. One patient record, reachable by any doctor with the Aadhar number.</p>`,
docs:()=>`<h2>Our doctors</h2><select onchange="fs=+this.value;go('docs')"><option value="-1">All specialties</option>${J(S.map((s,i)=>`<option value="${i}" ${fs==i?"selected":""}>${IC[i]} ${s}</option>`))}</select><div class="g">${J(DOCS.filter(d=>fs<0||d.s==fs).map(dcard))}</div>`,
em:()=>`<div class="em"><h1 style="margin-top:0">Emergency</h1><p>Emergency alerts go to the top of every hospital's queue, ahead of normal appointments.</p><a class="btn" href="tel:108">Call 108 ambulance</a><a class="btn" href="tel:112">Call 112</a></div><h2>Nearest emergency-ready hospitals</h2><div class="g">${J(H.map((h,i)=>`<div class="c"><b>🏥 ${h[0]}</b><div class="mu">Arrival in about ${Math.round(h[1]*3)} min, ${h[2]} beds free</div><button style="background:var(--rd);color:#fff;margin-top:8px" onclick="sos(${i})">Alert and reserve bed</button></div>`))}</div>`,
tele:()=>`<h2>Video consultation</h2><p class="mu">Book a Google Meet or Zoom call for counselling or a special condition.</p><div class="c" style="max-width:560px"><label>Doctor</label><select id="td">${J(DOCS.map(d=>`<option value="${d.id}">${d.n}, ${S[d.s]}</option>`))}</select><label>Platform</label><select id="tp"><option>Google Meet</option><option>Zoom</option></select><label>Date and time</label><input id="tt" type="datetime-local"><label>Reason</label><textarea id="tr" rows=2 placeholder="Counselling, follow-up, second opinion"></textarea><button onclick="tele()">Request video consultation</button></div><h3>Your video consultations</h3>${J(A.filter(a=>a.link).map(apt))||'<p class="mu">None yet. Request one above.</p>'}`,
my:()=>{const p=P[me];return `<h2>Hello, ${p.n} 👋</h2><div class="g"><div class="c"><h3>Profile</h3>Aadhar: XXXX XXXX ${p.a.slice(-4)}<br>Age ${p.age}, ${p.g}, blood group ${p.bl}<br>Allergy: ${p.al}<br>Phone: ${p.ph}</div><div class="c"><h3>⏰ Medicine alarms</h3>${J(["Morning","Afternoon","Night"].map((n,k)=>`<div class="row"><span style="width:90px">${n}</span><input type="time" value="${T[k]}" onchange="T[${k}]=this.value;go('my')" style="flex:1"></div>`))}<button onclick="alarm()">${alarmOn?"Alarms are on ✓":"Enable alarms"}</button> <button onclick="ring(0,1)" style="background:var(--ac);color:var(--pd)">Test alarm</button><div class="mu" style="margin-top:6px">Keep this tab open. You get a sound and a notification.</div></div></div><h3>Today's medicines</h3><div class="g">${J(["🌅 Morning","☀️ Afternoon","🌙 Night"].map((n,k)=>`<div class="c"><b>${n}</b> <span class="mu">${T[k]}</span><br>${medsFor(k).join("<br>")||"Nothing due"}</div>`))}</div><h3>Medical history</h3>${hist(p)}<h3>My appointments</h3>${J(A.filter(a=>a.p==p.n).map(apt))||'<p class="mu">None yet.</p>'}`},
dr:()=>`<h2>Doctor portal</h2><div class="g"><div class="c"><h3>Appointment queue</h3><div class="mu">Emergencies are always first.</div>${J([...A].sort((a,b)=>b.em-a.em).map(apt))}</div><div class="c"><h3>🔎 Global patient lookup</h3><input id="aa" maxlength=12 inputmode="numeric" placeholder="12-digit Aadhar number"><button onclick="look()">Search all hospitals</button><div class="mu" style="margin-top:6px">Demo Aadhar: 234156789012</div></div></div><h3>Patients (click a name)</h3><div class="c">${J(P.map((p,i)=>`<div class="pr" onclick="sel=${i};go('dr');$('#pd').scrollIntoView()"><b>${p.n}</b> <span class="mu">${p.age}/${p.g}, Aadhar ${p.a}, last: ${p.v[0].pr}</span></div>`))}</div>${sel!=null?pd(P[sel]):""}`};
const pd=p=>`<div class="c" id="pd" style="margin-top:14px"><h2 style="margin-top:0">${p.n}</h2>Aadhar ${p.a}, phone ${p.ph}, blood ${p.bl}, allergy: ${p.al}<h3>Visit history and medicines</h3>${hist(p)}<h3>New prescription</h3><label>Diagnosis</label><input id="pp" value="${dx}" oninput="dx=this.value"><div class="row"><input id="pm" placeholder="Medicine, e.g. Amoxicillin 500mg"><label><input type=checkbox id="m0" checked> Morning</label><label><input type=checkbox id="m1"> Afternoon</label><label><input type=checkbox id="m2" checked> Night</label><input id="pdy" type=number value=5 min=1 style="width:70px;flex:none" aria-label="Days"></div><button onclick="addm()">Add medicine</button><div style="margin:8px 0">${J(draft.map(m=>`💊 ${m[0]}, ${m[1].join("-")}, ${m[2]} days<br>`))}</div><button onclick="rx()">Save and send on WhatsApp</button></div>`;
function find(){const q=($("#sym").value||"").toLowerCase();let b=0,bs=0;K.forEach((k,i)=>{const s=k.split(" ").filter(w=>q.includes(w)).length;if(s>bs){bs=s;b=i}});
const urg=/chest pain|unconscious|bleeding|stroke|can.t breathe|accident|seizure|poison/.test(q);
$("#res").innerHTML=(urg?`<div class="em" style="margin-top:14px">🚨 This may be an emergency. <a class="btn" href="#" onclick="go('em');return false">Go to Emergency</a></div>`:"")+`<h2>Suggested: ${IC[b]} ${S[b]}</h2><div class="g">${J(DOCS.filter(d=>d.s==b).sort((x,y)=>H[x.h][1]-H[y.h][1]).map(dcard))}</div><h3>Nearby hospitals</h3><div class="g">${J(H.map(h=>`<div class="c"><b>🏥 ${h[0]}</b><div class="mu">${h[1]} km away, ${h[2]} emergency beds free, open 24 hours</div></div>`))}</div><a href="https://www.google.com/maps/search/hospitals+near+me" target="_blank" rel="noopener">Open live map of hospitals near me</a>`}
function book(id,t){const d=DOCS[id];A.push({p:P[me].n,dr:d.n,h:H[d.h][0],t:"Today "+t,why:($("#sym")||{}).value||"Consultation",em:0});d.slots=d.slots.filter(x=>x!=t);toast(`✅ Booked ${d.n} at ${t}. Confirmation sent on WhatsApp.`);pg=="home"?find():go(pg)}
function sos(i){A.unshift({p:P[me].n,dr:"Emergency team",h:H[i][0],t:"NOW",why:"EMERGENCY",em:1});toast(`🚨 ${H[i][0]} alerted. You are top priority.`)}
function tele(){const d=DOCS[+$("#td").value],pf=$("#tp").value;A.push({p:P[me].n,dr:d.n,h:"Online",t:$("#tt").value||"Next available",why:$("#tr").value||"Counselling",em:0,pf,link:pf=="Zoom"?"https://zoom.us/join":"https://meet.google.com/new"});toast(`📹 ${pf} request sent to ${d.n}`);go("tele")}
function look(){const i=P.findIndex(p=>p.a==$("#aa").value.trim());if(i<0)return toast("No record found for this Aadhar number.");sel=i;toast("Record found in the shared network.");go("dr");$("#pd").scrollIntoView()}
function addm(){const n=$("#pm").value.trim();if(!n)return toast("Enter a medicine name.");draft.push([n,[0,1,2].map(k=>+$("#m"+k).checked),$("#pdy").value||5]);go("dr")}
function rx(){if(!draft.length)return toast("Add at least one medicine.");const p=P[sel];p.v.unshift({d:today,dr:"Dr. Anita Rao",pr:dx||"Consultation",m:draft});
const t=`*AROGYA Prescription*\nPatient: ${p.n}\nDate: ${today}\nDiagnosis: ${dx||"Consultation"}\n\n`+draft.map((m,i)=>`${i+1}. ${m[0]}, Morning-Afternoon-Night: ${m[1].join("-")}, ${m[2]} days`).join("\n")+"\n\nGet well soon!";

function beep(){ac=ac||new(window.AudioContext||window.webkitAudioContext)();let i=0;const iv=setInterval(()=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=.25;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.3);if(++i>=12)clearInterval(iv)},500)}
